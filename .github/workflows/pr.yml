name: PR

# Keeps unit tests and lint inside the review loop. Publishing stays a manual
# Release workflow, so main-branch pushes are handled there instead.
on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: write

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: ./gradlew test --warning-mode fail > gradle.log 2>&1

      - name: Publish log
        if: steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 200 gradle.log > ci-log.txt
          python3 - <<'PY'
          import os, json, base64, urllib.request
          tok = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          hdr = {"Authorization": f"Bearer {tok}", "Accept": "application/vnd.github+json"}
          def req(m, u, d=None):
              r = urllib.request.Request(u, method=m, headers=hdr,
                                         data=json.dumps(d).encode() if d else None)
              try:
                  with urllib.request.urlopen(r) as x: return json.loads(x.read())
              except urllib.error.HTTPError as e: return {"err": e.code}
          if req("GET", f"https://api.github.com/repos/{repo}/git/ref/heads/ci-logs").get("err"):
              req("POST", f"https://api.github.com/repos/{repo}/git/refs",
                  {"ref": "refs/heads/ci-logs", "sha": os.environ["GITHUB_SHA"]})
          content = base64.b64encode(open("ci-log.txt", "rb").read()).decode()
          data = {"message": "ci log", "content": content, "branch": "ci-logs"}
          cur = req("GET", f"https://api.github.com/repos/{repo}/contents/ci-log.txt?ref=ci-logs")
          if isinstance(cur, dict) and cur.get("sha"): data["sha"] = cur["sha"]
          print(req("PUT", f"https://api.github.com/repos/{repo}/contents/ci-log.txt", data))
          PY

      - name: Run lint
        run: ./gradlew lintDebug --warning-mode fail

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          if-no-files-found: ignore
          retention-days: 7
          path: app/build/reports/tests
